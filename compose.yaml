version: "3.9"

services:
  wordpress:
    image: wordpress:latest
    ports:
      - "8080:8000"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wp_db}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wp_user}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
    volumes:
      - wp_data:/var/www/html
    depends_on:
      - db
    restart: always
    networks:
      - wpnet

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${WORDPRESS_DB_NAME:-wp_db}
      MYSQL_USER: ${WORDPRESS_DB_USER:-wp_user}
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "true"
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    networks:
      - wpnet

volumes:
  wp_data:
  db_data:

networks:
  wpnet:
